name: Signaler un dysfonctionnement
description: Décrire un comportement incorrect avec des données exclusivement fictives.
title: "[Bug] "
body:
  - type: textarea
    id: summary
    attributes:
      label: Résumé
      description: Que s'est-il passé en une phrase ?
    validations:
      required: true

  - type: dropdown
    id: environment
    attributes:
      label: Environnement
      options:
        - Preview Vercel
        - Production
        - Développement local
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Appareil et navigateur
      placeholder: Ex. iPhone 15 / Safari ou Windows 11 / Chrome
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      description: Numéroter les clics ou actions nécessaires.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Résultat attendu
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Résultat observé
    validations:
      required: true

  - type: checkboxes
    id: safety
    attributes:
      label: Confidentialité
      options:
        - label: Ce ticket ne contient aucun secret, aucune donnée client et aucune vulnérabilité exploitable.
          required: true

