# Temporary repair runner for PR #13. Removed after the reviewed lockfile is committed.
# It prepares a Git blob only: no ref update, merge, deployment, database or live secret.
name: Temporary · fast-uri lockfile repair

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - .github/workflows/prepare-fast-uri-lock.yml

permissions:
  contents: read

jobs:
  prepare:
    if: >-
      github.event.pull_request.number == 13 &&
      github.event.pull_request.head.repo.full_name == 'tablenow101/tablenow-copilot' &&
      github.event.pull_request.head.ref == 'product/onboarding-final-experience'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout the diagnosed revision only
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 0aca9b9565298e43cfee1e801efd5268cf42f031
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          version: 11.19.0
      - name: Install Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - name: Install locked dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Resolve only the two affected packages within existing dependency ranges
        run: pnpm --recursive update fast-uri qs --depth 100 --lockfile-only --ignore-scripts
      - name: Verify the repair scope and package-major compatibility
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const changed = execFileSync('git', ['diff', '--name-only'], { encoding: 'utf8' }).trim().split('\n').filter(Boolean);
          if (changed.length !== 1 || changed[0] !== 'pnpm-lock.yaml') {
            throw new Error(`Unexpected changed files: ${changed.join(', ')}`);
          }
          const before = execFileSync('git', ['show', 'HEAD:pnpm-lock.yaml'], { encoding: 'utf8' });
          const after = readFileSync('pnpm-lock.yaml', 'utf8');
          if (before.split('\npackages:\n')[0] !== after.split('\npackages:\n')[0]) {
            throw new Error('Refusing changes to importers, direct dependency ranges or lockfile settings.');
          }
          const keys = text => [...text.split('\npackages:\n')[1].split('\nsnapshots:\n')[0].matchAll(/^  (\S[^\n]*):$/gm)].map(m => m[1]);
          const oldKeys = new Set(keys(before));
          const newKeys = new Set(keys(after));
          const removed = [...oldKeys].filter(k => !newKeys.has(k));
          const added = [...newKeys].filter(k => !oldKeys.has(k));
          if (removed.length !== 3 || added.length !== 3 || [...removed, ...added].some(k => !/^(fast-uri|qs)@\d+\.\d+\.\d+$/.test(k))) {
            throw new Error(`Unexpected dependency changes: ${JSON.stringify({ removed, added })}`);
          }
          const releaseLine = key => key.split('@')[0] + '@' + key.split('@')[1].split('.')[0];
          if (removed.some(k => !added.some(a => releaseLine(a) === releaseLine(k))) || added.some(a => !removed.some(k => releaseLine(k) === releaseLine(a)))) {
            throw new Error('Refusing any package major-version change.');
          }
          for (const key of added) {
            const name = key.split('@')[0];
            const [ma, mi, pa] = key.split('@')[1].split('.').map(Number);
            const patched = name === 'qs'
              ? ma === 6 && mi >= 16
              : (ma === 3 && (mi > 1 || (mi === 1 && pa >= 6))) || (ma === 4 && (mi > 1 || (mi === 1 && pa >= 3)));
            if (!patched) throw new Error(`Version is not an approved patched release line: ${key}`);
          }
          console.log('TARGETED_REPAIR', JSON.stringify({ removed, added }));
          NODE
          git diff --check
          git diff -- pnpm-lock.yaml
      - name: Verify frozen installation of the candidate lockfile
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Keep the existing high-severity audit gate
        run: pnpm audit --audit-level=high
      - name: Require a clean full audit for this repair
        run: |
          pnpm audit --json > /tmp/audit-after.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('/tmp/audit-after.json', 'utf8'));
          if (report.error || !report.metadata?.vulnerabilities) throw new Error('Registry audit failed.');
          const counts = report.metadata.vulnerabilities;
          if (Object.values(counts).some(count => count !== 0)) throw new Error('The candidate still has audit findings.');
          console.log(JSON.stringify(report, null, 2));
          NODE
      - name: Store the verified lockfile as an unreferenced Git blob for review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const content = readFileSync('pnpm-lock.yaml');
          const expected = execFileSync('git', ['hash-object', 'pnpm-lock.yaml'], { encoding: 'utf8' }).trim();
          const response = await fetch('https://api.github.com/repos/tablenow101/tablenow-copilot/git/blobs', {
            method: 'POST',
            headers: {
              authorization: `Bearer ${process.env.GH_TOKEN}`,
              accept: 'application/vnd.github+json',
              'content-type': 'application/json',
              'X-GitHub-Api-Version': '2022-11-28',
            },
            body: JSON.stringify({ content: content.toString('base64'), encoding: 'base64' }),
            signal: AbortSignal.timeout(30000),
          });
          if (!response.ok) throw new Error(`Could not store the candidate blob: HTTP ${response.status}`);
          const blob = await response.json();
          if (blob.sha !== expected) throw new Error('Returned blob does not match the generated lockfile.');
          console.log('VERIFIED_LOCKFILE_BLOB_SHA=' + blob.sha);
          console.log('No branch, production deployment or database was changed by this job.');
          NODE
