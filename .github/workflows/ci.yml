name: Verify TableNow Platform

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        run: docker compose --env-file deploy/docker/node.env.example -f deploy/docker/compose.yml config --quiet
      - name: Build the local-first image
        run: |
          docker build --target runtime-services -f deploy/docker/Dockerfile -t tablenow-platform:${{ github.sha }} .
          docker build --target runtime-runner -f deploy/docker/Dockerfile -t tablenow-computer-runner:${{ github.sha }} .
          docker build --target runtime-console -f deploy/docker/Dockerfile -t tablenow-console:${{ github.sha }} .

  tenant-isolation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tablenow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tablenow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tablenow_test
      INTEGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tablenow_test
      PUBLIC_ORIGIN: http://localhost:8080
      SESSION_SECRET: integration-session-secret-000000000000000000000
      OTP_PEPPER: integration-otp-pepper-0000000000000000000000
      PLATFORM_ADMIN_EMAIL: test@tablenow.local
      EMAIL_TRANSPORT: log
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm --filter @tablenow/core-api test:integration
