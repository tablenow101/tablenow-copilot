name: TableNow Copilot · Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true

defaults:
  run:
    shell: bash

jobs:
  quality:
    name: Qualité · TypeScript, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile
      - name: Vérifier les règles statiques
        run: pnpm lint
      - name: Vérifier le typage strict
        run: pnpm typecheck
      - name: Exécuter les tests
        run: pnpm test
      - name: Construire tous les composants
        run: pnpm build
      - name: Auditer les dépendances
        run: pnpm audit --audit-level=high

  tenant-isolation:
    name: Données · Isolation PostgreSQL
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tablenow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tablenow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tablenow_test
      INTEGRATION_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/tablenow_test
      PUBLIC_ORIGIN: http://localhost:8080
      SESSION_SECRET: integration-session-secret-000000000000000000000
      OTP_PEPPER: integration-otp-pepper-0000000000000000000000
      PLATFORM_ADMIN_EMAIL: test@tablenow.local
      EMAIL_TRANSPORT: log
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - name: Installer Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile
      - name: Appliquer les migrations
        run: pnpm db:migrate
      - name: Tester l'isolation entre restaurants
        run: pnpm --filter @tablenow/core-api test:integration

  container:
    name: Portabilité · Images Docker
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Valider Docker Compose
        run: docker compose --env-file deploy/docker/node.env.example -f deploy/docker/compose.yml config --quiet
      - name: Construire les images
        run: |
          docker build --target runtime-services -f deploy/docker/Dockerfile -t tablenow-copilot:${{ github.sha }} .
          docker build --target runtime-runner -f deploy/docker/Dockerfile -t tablenow-computer-runner:${{ github.sha }} .
          docker build --target runtime-console -f deploy/docker/Dockerfile -t tablenow-console:${{ github.sha }} .
